<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Five numbered steps for a breakdown in tule fog: signal and ease right, get fully off the road, lights and seat belt on, call 911 if stuck in a lane, and give an exact location">
<title>Five numbered steps for a breakdown in tule fog: signal and ease right, get fully off the road, lights and seat belt on, call 911 if stuck in a lane, and give an exact location</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0f12"/><stop offset="1" stop-color="#1b1f24"/></linearGradient>
<filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<radialGradient id="flare"><stop offset="0" stop-color="#ff6b2c" stop-opacity=".75"/><stop offset="1" stop-color="#ff6b2c" stop-opacity="0"/></radialGradient>
<radialGradient id="amberGlow"><stop offset="0" stop-color="#ffb03a" stop-opacity=".6"/><stop offset="1" stop-color="#ffb03a" stop-opacity="0"/></radialGradient>
<radialGradient id="lamp"><stop offset="0" stop-color="#ffcf8a" stop-opacity=".35"/><stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/></radialGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff6b2c"/></marker>
<marker id="arrW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a6aca5"/></marker>
</defs>
<rect width="1200" height="520" fill="#121417"/><text x="60" y="70" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="30" fill="#eceeea">If you break down in tule fog</text><circle cx="86" cy="144" r="24" fill="#17673f"/><text x="86" y="153" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="24" fill="#eceeea">1</text><text x="132" y="142" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#eceeea">Signal and ease right</text><text x="132" y="168" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="17" fill="#a6aca5">Do not stop in a lane. Coast as far as the car will go.</text><circle cx="86" cy="222" r="24" fill="#17673f"/><text x="86" y="231" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="24" fill="#eceeea">2</text><text x="132" y="220" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#eceeea">Get fully off the road</text><text x="132" y="246" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="17" fill="#a6aca5">Past the fog line, onto an off-ramp if you can reach it.</text><circle cx="86" cy="300" r="24" fill="#17673f"/><text x="86" y="309" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="24" fill="#eceeea">3</text><text x="132" y="298" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#eceeea">Lights on, belt on</text><text x="132" y="324" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="17" fill="#a6aca5">Parking lights and hazards. Stay inside unless it is unsafe.</text><circle cx="86" cy="378" r="24" fill="#ff6b2c"/><text x="86" y="387" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="24" fill="#121417">4</text><text x="132" y="376" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#eceeea">Stuck in a lane? Call 911</text><text x="132" y="402" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="17" fill="#a6aca5">CHP can manage traffic. Then call for a tow.</text><circle cx="86" cy="456" r="24" fill="#17673f"/><text x="86" y="465" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="24" fill="#eceeea">5</text><text x="132" y="454" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#eceeea">Give an exact location</text><text x="132" y="480" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="17" fill="#a6aca5">Freeway, direction, nearest exit or call box number.</text><g transform="translate(1060,140) scale(1.1)"><path d="M-32 -30 Q-16 -38 0 -30 Q16 -38 32 -30 Q36 4 0 38 Q-36 4 -32 -30 Z" fill="#1f4f9a" stroke="#eceeea" stroke-width="3"/><path d="M-30 -22 Q-16 -30 0 -22 Q16 -30 30 -22 L31 -14 L-31 -14 Z" fill="#e5484d"/><text x="0" y="16" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="28" fill="#eceeea">5</text></g><g transform="translate(1060,260) scale(1.1)"><path d="M-30 -34 Q-22 -40 -14 -34 Q-6 -28 0 -36 Q6 -28 14 -34 Q22 -40 30 -34 L28 6 Q22 28 0 40 Q-22 28 -28 6 Z" fill="#17673f" stroke="#eceeea" stroke-width="3"/><text x="0" y="12" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="30" fill="#eceeea">99</text></g>
</svg>
