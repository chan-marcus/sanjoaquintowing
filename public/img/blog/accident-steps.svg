<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Six steps after an accident: check for injuries and call 911 if needed, get out of traffic, photograph everything, exchange information, get the report number, then tow to the shop you choose">
<title>Six steps after an accident: check for injuries and call 911 if needed, get out of traffic, photograph everything, exchange information, get the report number, then tow to the shop you choose</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0f12"/><stop offset="1" stop-color="#1b1f24"/></linearGradient>
<linearGradient id="hot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1a12"/><stop offset="1" stop-color="#1b1f24"/></linearGradient>
<filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<radialGradient id="flare"><stop offset="0" stop-color="#ff6b2c" stop-opacity=".75"/><stop offset="1" stop-color="#ff6b2c" stop-opacity="0"/></radialGradient>
<radialGradient id="amberGlow"><stop offset="0" stop-color="#ffb03a" stop-opacity=".6"/><stop offset="1" stop-color="#ffb03a" stop-opacity="0"/></radialGradient>
<radialGradient id="lamp"><stop offset="0" stop-color="#ffcf8a" stop-opacity=".35"/><stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/></radialGradient>
<radialGradient id="sun"><stop offset="0" stop-color="#ffcf8a" stop-opacity=".55"/><stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/></radialGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff6b2c"/></marker>
<marker id="arrW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a6aca5"/></marker>
</defs>
<rect width="1200" height="560" fill="#121417"/><text x="60" y="70" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="30" fill="#eceeea">After an accident on I-5 or Highway 99</text><circle cx="86" cy="134" r="24" fill="#ff6b2c"/><text x="86" y="143.0" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="24" fill="#121417">1</text><text x="132" y="132.0" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#eceeea">Check for injuries, call 911 if needed</text><text x="132" y="158.0" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="17" fill="#a6aca5">Fire, fuel leak, anyone hurt or a car stuck in a lane: 911 first.</text><circle cx="86" cy="206" r="24" fill="#17673f"/><text x="86" y="214.66666666666669" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="24" fill="#eceeea">2</text><text x="132" y="203.66666666666669" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#eceeea">Get out of traffic</text><text x="132" y="229.66666666666669" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="17" fill="#a6aca5">Shoulder or next exit if the cars still drive. Hazards on.</text><circle cx="86" cy="277" r="24" fill="#17673f"/><text x="86" y="286.33333333333337" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="24" fill="#eceeea">3</text><text x="132" y="275.33333333333337" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#eceeea">Photograph everything</text><text x="132" y="301.33333333333337" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="17" fill="#a6aca5">All four corners of each car, plates, the road and debris.</text><circle cx="86" cy="349" r="24" fill="#17673f"/><text x="86" y="358.0" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="24" fill="#eceeea">4</text><text x="132" y="347.0" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#eceeea">Exchange information</text><text x="132" y="373.0" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="17" fill="#a6aca5">Name, phone, insurer and policy number. Stick to facts.</text><circle cx="86" cy="421" r="24" fill="#17673f"/><text x="86" y="429.6666666666667" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="24" fill="#eceeea">5</text><text x="132" y="418.6666666666667" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#eceeea">Get the report number</text><text x="132" y="444.6666666666667" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="17" fill="#a6aca5">CHP on freeways, Stockton Police on city streets.</text><circle cx="86" cy="492" r="24" fill="#17673f"/><text x="86" y="501.33333333333337" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="24" fill="#eceeea">6</text><text x="132" y="490.33333333333337" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#eceeea">Tow to the shop you choose</text><text x="132" y="516.3333333333334" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="17" fill="#a6aca5">Not required to use the rotation yard if you arrange your own.</text><g transform="translate(1060,150) scale(1.1)"><path d="M-32 -30 Q-16 -38 0 -30 Q16 -38 32 -30 Q36 4 0 38 Q-36 4 -32 -30 Z" fill="#1f4f9a" stroke="#eceeea" stroke-width="3"/><path d="M-30 -22 Q-16 -30 0 -22 Q16 -30 30 -22 L31 -14 L-31 -14 Z" fill="#e5484d"/><text x="0" y="16" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="28" fill="#eceeea">5</text></g><g transform="translate(1060,270) scale(1.1)"><path d="M-30 -34 Q-22 -40 -14 -34 Q-6 -28 0 -36 Q6 -28 14 -34 Q22 -40 30 -34 L28 6 Q22 28 0 40 Q-22 28 -28 6 Z" fill="#17673f" stroke="#eceeea" stroke-width="3"/><text x="0" y="12" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="30" fill="#eceeea">99</text></g>
</svg>
