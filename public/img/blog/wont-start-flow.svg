<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Flowchart for a car that will not start: rapid clicking points to the battery and a jump start, no sound points to the gear selector, brake and key fob, and cranking without starting points to fuel or ignition and a tow to a mechanic">
<title>Flowchart for a car that will not start: rapid clicking points to the battery and a jump start, no sound points to the gear selector, brake and key fob, and cranking without starting points to fuel or ignition and a tow to a mechanic</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0f12"/><stop offset="1" stop-color="#1b1f24"/></linearGradient>
<linearGradient id="hot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1a12"/><stop offset="1" stop-color="#1b1f24"/></linearGradient>
<filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<radialGradient id="flare"><stop offset="0" stop-color="#ff6b2c" stop-opacity=".75"/><stop offset="1" stop-color="#ff6b2c" stop-opacity="0"/></radialGradient>
<radialGradient id="amberGlow"><stop offset="0" stop-color="#ffb03a" stop-opacity=".6"/><stop offset="1" stop-color="#ffb03a" stop-opacity="0"/></radialGradient>
<radialGradient id="lamp"><stop offset="0" stop-color="#ffcf8a" stop-opacity=".35"/><stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/></radialGradient>
<radialGradient id="sun"><stop offset="0" stop-color="#ffcf8a" stop-opacity=".55"/><stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/></radialGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff6b2c"/></marker>
<marker id="arrW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a6aca5"/></marker>
</defs>
<rect width="1200" height="600" fill="#121417"/><rect x="400" y="30" width="400" height="80" rx="10" fill="#1f2328" stroke="#ff6b2c" stroke-width="3"/><text x="600.0" y="64.0" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="21" fill="#eceeea">Turn the key. What happens?</text><text x="600.0" y="90.0" text-anchor="middle" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="15" fill="#a6aca5">Listen first: the sound tells you the cause</text><path d="M600 110 L600 140 M200 140 L1000 140 M200 140 L200 170 M600 140 L600 170 M1000 140 L1000 170" stroke="#a6aca5" stroke-width="3" fill="none"/><rect x="40" y="170" width="320" height="80" rx="10" fill="#1f2328" stroke="#4a5048" stroke-width="2"/><text x="200.0" y="204.0" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="21" fill="#eceeea">Rapid clicking</text><text x="200.0" y="230.0" text-anchor="middle" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="15" fill="#a6aca5">Dim or flickering dash lights</text><path d="M200 250 L200 286" stroke="#a6aca5" stroke-width="3" marker-end="url(#arrW)"/><rect x="40" y="292" width="320" height="80" rx="10" fill="#1f2328" stroke="#4a5048" stroke-width="2"/><text x="200.0" y="326.0" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="21" fill="#eceeea">Weak or dead battery</text><text x="200.0" y="352.0" text-anchor="middle" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="15" fill="#a6aca5">Check terminals for looseness</text><path d="M200 372 L200 408" stroke="#a6aca5" stroke-width="3" marker-end="url(#arrW)"/><rect x="40" y="414" width="320" height="80" rx="10" fill="#1f2328" stroke="#4a5048" stroke-width="2"/><text x="200.0" y="448.0" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="21" fill="#eceeea">Jump start</text><text x="200.0" y="474.0" text-anchor="middle" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="15" fill="#a6aca5">Starts and stays running? Test the battery</text><rect x="440" y="170" width="320" height="80" rx="10" fill="#1f2328" stroke="#4a5048" stroke-width="2"/><text x="600.0" y="204.0" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="21" fill="#eceeea">Nothing at all</text><text x="600.0" y="230.0" text-anchor="middle" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="15" fill="#a6aca5">Dash lights still come on</text><path d="M600 250 L600 286" stroke="#a6aca5" stroke-width="3" marker-end="url(#arrW)"/><rect x="440" y="292" width="320" height="80" rx="10" fill="#1f2328" stroke="#4a5048" stroke-width="2"/><text x="600.0" y="326.0" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="21" fill="#eceeea">Park, brake, key fob</text><text x="600.0" y="352.0" text-anchor="middle" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="15" fill="#a6aca5">Shifter in Park, brake down, fob on button</text><path d="M600 372 L600 408" stroke="#a6aca5" stroke-width="3" marker-end="url(#arrW)"/><rect x="440" y="414" width="320" height="80" rx="10" fill="#1f2328" stroke="#4a5048" stroke-width="2"/><text x="600.0" y="448.0" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="21" fill="#eceeea">Still nothing?</text><text x="600.0" y="474.0" text-anchor="middle" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="15" fill="#a6aca5">Terminals, then a jump</text><rect x="840" y="170" width="320" height="80" rx="10" fill="#1f2328" stroke="#4a5048" stroke-width="2"/><text x="1000.0" y="204.0" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="21" fill="#eceeea">Cranks, never fires</text><text x="1000.0" y="230.0" text-anchor="middle" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="15" fill="#a6aca5">Engine turns at normal speed</text><path d="M1000 250 L1000 286" stroke="#a6aca5" stroke-width="3" marker-end="url(#arrW)"/><rect x="840" y="292" width="320" height="80" rx="10" fill="#1f2328" stroke="#4a5048" stroke-width="2"/><text x="1000.0" y="326.0" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="21" fill="#eceeea">Fuel, spark or sensor</text><text x="1000.0" y="352.0" text-anchor="middle" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="15" fill="#a6aca5">Check the fuel gauge first</text><path d="M1000 372 L1000 408" stroke="#a6aca5" stroke-width="3" marker-end="url(#arrW)"/><rect x="840" y="414" width="320" height="80" rx="10" fill="#1f2328" stroke="#4a5048" stroke-width="2"/><text x="1000.0" y="448.0" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="21" fill="#eceeea">Tow to a mechanic</text><text x="1000.0" y="474.0" text-anchor="middle" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="15" fill="#a6aca5">Do not keep cranking it</text><text x="600" y="580" text-anchor="middle" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="700" font-size="18" fill="#ff6b2c">Starts with a jump, then dies again? Suspect the alternator.</text>
</svg>
