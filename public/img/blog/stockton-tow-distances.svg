<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Bar chart of approximate road miles from central Stockton: Lodi and Manteca about 13, Tracy about 21, Modesto about 30, Livermore about 46 over the Altamont, and Sacramento about 48">
<title>Bar chart of approximate road miles from central Stockton: Lodi and Manteca about 13, Tracy about 21, Modesto about 30, Livermore about 46 over the Altamont, and Sacramento about 48</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0f12"/><stop offset="1" stop-color="#1b1f24"/></linearGradient>
<filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
