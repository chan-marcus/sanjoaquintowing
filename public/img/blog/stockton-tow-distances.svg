<rect width="1200" height="560" fill="#121417"/><text x="60" y="70" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="30" fill="#eceeea">Common runs from central Stockton</text><text x="60" y="102" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="17" fill="#a6aca5">Approximate road miles. Mileage is usually the biggest variable in a tow quote.</text><text x="60" y="180" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#eceeea">Lodi</text><rect x="230" y="158" width="143" height="32" rx="4" fill="#ff6b2c"/><text x="383" y="181" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="800" font-size="18" fill="#eceeea">about 13 mi</text><text x="509" y="181" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="15" fill="#a6aca5">Hwy 99 north</text><text x="60" y="244" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#eceeea">Manteca</text><rect x="230" y="222" width="143" height="32" rx="4" fill="#ff6b2c"/><text x="383" y="245" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="800" font-size="18" fill="#eceeea">about 13 mi</text><text x="509" y="245" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="15" fill="#a6aca5">Hwy 99 south</text><text x="60" y="308" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#eceeea">Tracy</text><rect x="230" y="286" width="231" height="32" rx="4" fill="#ff6b2c"/><text x="471" y="309" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="800" font-size="18" fill="#eceeea">about 21 mi</text><text x="597" y="309" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="15" fill="#a6aca5">I-5 to I-205</text><text x="60" y="372" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#eceeea">Modesto</text><rect x="230" y="350" width="330" height="32" rx="4" fill="#17673f"/><text x="570" y="373" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="800" font-size="18" fill="#eceeea">about 30 mi</text><text x="696" y="373" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="15" fill="#a6aca5">Hwy 99 south</text><text x="60" y="436" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#eceeea">Livermore</text><rect x="230" y="414" width="506" height="32" rx="4" fill="#17673f"/><text x="746" y="437" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="800" font-size="18" fill="#eceeea">about 46 mi</text><text x="872" y="437" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="15" fill="#a6aca5">I-205 to I-580, over the Altamont</text><text x="60" y="500" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#eceeea">Sacramento</text><rect x="230" y="478" width="528" height="32" rx="4" fill="#17673f"/><text x="768" y="501" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="800" font-size="18" fill="#eceeea">about 48 mi</text><text x="894" y="501" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="15" fill="#a6aca5">I-5 or Hwy 99 north</text>
</svg>
