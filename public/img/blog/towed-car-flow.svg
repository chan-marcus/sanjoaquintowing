<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Flowchart for finding a towed car: police or CHP tows go through the agency, private property tows through the number on the posted sign, and both end at the yard with ID, registration and payment">
<title>Flowchart for finding a towed car: police or CHP tows go through the agency, private property tows through the number on the posted sign, and both end at the yard with ID, registration and payment</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0f12"/><stop offset="1" stop-color="#1b1f24"/></linearGradient>
<filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<radialGradient id="flare"><stop offset="0" stop-color="#ff6b2c" stop-opacity=".75"/><stop offset="1" stop-color="#ff6b2c" stop-opacity="0"/></radialGradient>
<radialGradient id="amberGlow"><stop offset="0" stop-color="#ffb03a" stop-opacity=".6"/><stop offset="1" stop-color="#ffb03a" stop-opacity="0"/></radialGradient>
<radialGradient id="lamp"><stop offset="0" stop-color="#ffcf8a" stop-opacity=".35"/><stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/></radialGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff6b2c"/></marker>
<marker id="arrW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a6aca5"/></marker>
</defs>
<rect width="1200" height="600" fill="#121417"/><rect x="420" y="30" width="360" height="80" rx="9" fill="#1f2328" stroke="#ff6b2c" stroke-width="3"/><text x="600.0" y="64.0" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="21" fill="#eceeea">Your car is gone</text><text x="600.0" y="90.0" text-anchor="middle" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="15" fill="#a6aca5">Make sure it was towed, not stolen</text><path d="M600 110 L600 140 M600 140 L300 140 L300 170 M600 140 L900 140 L900 170" stroke="#a6aca5" stroke-width="3" fill="none"/><rect x="120" y="170" width="360" height="80" rx="9" fill="#1f2328" stroke="#4a5048" stroke-width="2"/><text x="300.0" y="204.0" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="21" fill="#eceeea">Police or CHP tow</text><text x="300.0" y="230.0" text-anchor="middle" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="15" fill="#a6aca5">Crash, violation, expired tags</text><rect x="720" y="170" width="360" height="80" rx="9" fill="#1f2328" stroke="#4a5048" stroke-width="2"/><text x="900.0" y="204.0" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="21" fill="#eceeea">Private property tow</text><text x="900.0" y="230.0" text-anchor="middle" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="15" fill="#a6aca5">Apartment, store or office lot</text><path d="M300 250 L300 290" stroke="#a6aca5" stroke-width="3" marker-end="url(#arrW)"/><path d="M900 250 L900 290" stroke="#a6aca5" stroke-width="3" marker-end="url(#arrW)"/><rect x="120" y="296" width="360" height="80" rx="9" fill="#1f2328" stroke="#4a5048" stroke-width="2"/><text x="300.0" y="330.0" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="21" fill="#eceeea">Call that agency</text><text x="300.0" y="356.0" text-anchor="middle" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="15" fill="#a6aca5">Ask which yard, and if a release is needed</text><rect x="720" y="296" width="360" height="80" rx="9" fill="#1f2328" stroke="#4a5048" stroke-width="2"/><text x="900.0" y="330.0" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="21" fill="#eceeea">Call the number on the sign</text><text x="900.0" y="356.0" text-anchor="middle" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="15" fill="#a6aca5">Or the police non-emergency line</text><path d="M300 376 L300 410 L600 410 L600 430 M900 376 L900 410 L600 410" stroke="#a6aca5" stroke-width="3" fill="none" marker-end="url(#arrW)"/><rect x="360" y="436" width="480" height="80" rx="9" fill="#1f2328" stroke="#ff6b2c" stroke-width="3"/><text x="600.0" y="470.0" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="21" fill="#eceeea">Go to the yard with ID + registration</text><text x="600.0" y="496.0" text-anchor="middle" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="15" fill="#a6aca5">Plus payment. Storage is charged per day</text><text x="600" y="568" text-anchor="middle" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="700" font-size="18" fill="#ff6b2c">Move fast: every day in storage adds to the bill.</text>
</svg>
