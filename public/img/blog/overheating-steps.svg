<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Six steps when a car overheats: A/C off, heater on full, get out of slow traffic, engine off if the gauge is red, wait 30 minutes, check coolant only when cold, with a warning never to open the radiator cap on a hot engine">
<title>Six steps when a car overheats: A/C off, heater on full, get out of slow traffic, engine off if the gauge is red, wait 30 minutes, check coolant only when cold, with a warning never to open the radiator cap on a hot engine</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0f12"/><stop offset="1" stop-color="#1b1f24"/></linearGradient>
<linearGradient id="hot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1a12"/><stop offset="1" stop-color="#1b1f24"/></linearGradient>
<filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<radialGradient id="flare"><stop offset="0" stop-color="#ff6b2c" stop-opacity=".75"/><stop offset="1" stop-color="#ff6b2c" stop-opacity="0"/></radialGradient>
<radialGradient id="amberGlow"><stop offset="0" stop-color="#ffb03a" stop-opacity=".6"/><stop offset="1" stop-color="#ffb03a" stop-opacity="0"/></radialGradient>
<radialGradient id="lamp"><stop offset="0" stop-color="#ffcf8a" stop-opacity=".35"/><stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/></radialGradient>
<radialGradient id="sun"><stop offset="0" stop-color="#ffcf8a" stop-opacity=".55"/><stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/></radialGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff6b2c"/></marker>
<marker id="arrW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a6aca5"/></marker>
</defs>
<rect width="1200" height="560" fill="#121417"/><text x="60" y="70" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="30" fill="#eceeea">When the temperature gauge climbs</text><circle cx="86" cy="134" r="24" fill="#17673f"/><text x="86" y="143.0" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="24" fill="#eceeea">1</text><text x="132" y="132.0" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#eceeea">Turn the A/C off</text><text x="132" y="158.0" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="17" fill="#a6aca5">The compressor adds load and heat.</text><circle cx="86" cy="206" r="24" fill="#17673f"/><text x="86" y="214.66666666666669" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="24" fill="#eceeea">2</text><text x="132" y="203.66666666666669" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#eceeea">Turn the heater on full</text><text x="132" y="229.66666666666669" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="17" fill="#a6aca5">The heater core pulls heat away from the engine.</text><circle cx="86" cy="277" r="24" fill="#17673f"/><text x="86" y="286.33333333333337" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="24" fill="#eceeea">3</text><text x="132" y="275.33333333333337" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#eceeea">Get out of slow traffic</text><text x="132" y="301.33333333333337" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="17" fill="#a6aca5">Next exit or the widest shoulder you can reach.</text><circle cx="86" cy="349" r="24" fill="#ff6b2c"/><text x="86" y="358.0" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="24" fill="#121417">4</text><text x="132" y="347.0" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#eceeea">Engine off if the gauge is red</text><text x="132" y="373.0" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="17" fill="#a6aca5">Steam or a sweet smell: shut it off, do not idle it.</text><circle cx="86" cy="421" r="24" fill="#17673f"/><text x="86" y="429.6666666666667" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="24" fill="#eceeea">5</text><text x="132" y="418.6666666666667" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#eceeea">Wait at least 30 minutes</text><text x="132" y="444.6666666666667" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="17" fill="#a6aca5">Let the whole cooling system come down in pressure.</text><circle cx="86" cy="492" r="24" fill="#17673f"/><text x="86" y="501.33333333333337" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="24" fill="#eceeea">6</text><text x="132" y="490.33333333333337" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#eceeea">Check coolant only when cold</text><text x="132" y="516.3333333333334" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="17" fill="#a6aca5">Low with no leak: top up. Leaking or climbing again: tow.</text><rect x="820" y="150" width="330" height="170" rx="10" fill="#1f2328" stroke="#e5484d" stroke-width="3"/><text x="985" y="200" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="30" fill="#e5484d">NEVER</text><text x="985" y="236" text-anchor="middle" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="700" font-size="20" fill="#eceeea">open the radiator cap</text><text x="985" y="264" text-anchor="middle" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="700" font-size="20" fill="#eceeea">on a hot engine</text><text x="985" y="296" text-anchor="middle" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="500" font-size="15" fill="#a6aca5">Pressurized coolant can burn</text>
</svg>
