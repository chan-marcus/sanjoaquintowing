<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Diagram showing a tow price built from a hook-up fee, plus loaded mileage, plus extras such as winching or after-hours work, adding up to the quote given before dispatch">
<title>Diagram showing a tow price built from a hook-up fee, plus loaded mileage, plus extras such as winching or after-hours work, adding up to the quote given before dispatch</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0f12"/><stop offset="1" stop-color="#1b1f24"/></linearGradient>
<filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<radialGradient id="flare"><stop offset="0" stop-color="#ff6b2c" stop-opacity=".75"/><stop offset="1" stop-color="#ff6b2c" stop-opacity="0"/></radialGradient>
<radialGradient id="amberGlow"><stop offset="0" stop-color="#ffb03a" stop-opacity=".6"/><stop offset="1" stop-color="#ffb03a" stop-opacity="0"/></radialGradient>
<radialGradient id="lamp"><stop offset="0" stop-color="#ffcf8a" stop-opacity=".35"/><stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/></radialGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff6b2c"/></marker>
<marker id="arrW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a6aca5"/></marker>
</defs>
<rect width="1200" height="480" fill="url(#sky)"/><rect x="80" y="150" width="230" height="170" rx="10" fill="#1f2328" stroke="#4a5048" stroke-width="2"/><text x="102" y="205" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="32" fill="#eceeea">Hook-up</text><text x="102" y="250" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="600" font-size="18" fill="#a6aca5">Base fee to attach</text><text x="102" y="276" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="600" font-size="18" fill="#a6aca5">and load the vehicle</text><text x="345" y="252" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="46" fill="#ff6b2c">+</text><rect x="380" y="150" width="230" height="170" rx="10" fill="#1f2328" stroke="#4a5048" stroke-width="2"/><text x="402" y="205" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="32" fill="#eceeea">Mileage</text><text x="402" y="250" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="600" font-size="18" fill="#a6aca5">Per loaded mile</text><text x="402" y="276" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="600" font-size="18" fill="#a6aca5">to the destination</text><text x="645" y="252" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="46" fill="#ff6b2c">+</text><rect x="680" y="150" width="230" height="170" rx="10" fill="#1f2328" stroke="#4a5048" stroke-width="2"/><text x="702" y="205" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="32" fill="#eceeea">Extras</text><text x="702" y="250" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="600" font-size="18" fill="#a6aca5">Winching, dollies,</text><text x="702" y="276" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="600" font-size="18" fill="#a6aca5">after-hours, storage</text><text x="945" y="252" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="46" fill="#ff6b2c">=</text><rect x="980" y="150" width="170" height="170" rx="10" fill="#ff6b2c"/><text x="1065" y="225" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="30" fill="#121417">Your</text><text x="1065" y="262" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="30" fill="#121417">quote</text><text x="1065" y="296" text-anchor="middle" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="700" font-size="15" fill="#121417">before dispatch</text><text x="600" y="90" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="34" fill="#eceeea">What goes into a tow price</text><text x="600" y="400" text-anchor="middle" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="600" font-size="19" fill="#a6aca5">Ask for every line item on the call. A good dispatcher will say them out loud.</text>
</svg>
