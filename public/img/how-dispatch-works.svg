<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Four-step flow of a call: you call (209) 850-ROAD, hear a quote and ETA before anything moves, the nearest licensed local operator is sent, and the job is done">
<title>Four-step flow of a call: you call (209) 850-ROAD, hear a quote and ETA before anything moves, the nearest licensed local operator is sent, and the job is done</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0f12"/><stop offset="1" stop-color="#1b1f24"/></linearGradient>
<filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<radialGradient id="flare"><stop offset="0" stop-color="#ff6b2c" stop-opacity=".75"/><stop offset="1" stop-color="#ff6b2c" stop-opacity="0"/></radialGradient>
<radialGradient id="amberGlow"><stop offset="0" stop-color="#ffb03a" stop-opacity=".6"/><stop offset="1" stop-color="#ffb03a" stop-opacity="0"/></radialGradient>
<radialGradient id="lamp"><stop offset="0" stop-color="#ffcf8a" stop-opacity=".35"/><stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/></radialGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff6b2c"/></marker>
<marker id="arrW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a6aca5"/></marker>
</defs>
<rect width="1200" height="480" fill="url(#sky)"/><rect x="42" y="150" width="240" height="200" rx="10" fill="#1f2328" stroke="#4a5048" stroke-width="2"/><circle cx="82" cy="150" r="26" fill="#17673f" stroke="#121417" stroke-width="4"/><text x="82.0" y="160" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="26" fill="#eceeea">1</text><text x="66.0" y="230" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="30" fill="#eceeea">You call</text><text x="66.0" y="276" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="600" font-size="18" fill="#a6aca5">(209) 850-ROAD</text><text x="66.0" y="302" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="600" font-size="18" fill="#a6aca5">A dispatcher answers</text><path d="M290 250 L326 250" stroke="#ff6b2c" stroke-width="4" marker-end="url(#arr)"/><rect x="334" y="150" width="240" height="200" rx="10" fill="#1f2328" stroke="#ff6b2c" stroke-width="3"/><circle cx="374" cy="150" r="26" fill="#ff6b2c" stroke="#121417" stroke-width="4"/><text x="374.0" y="160" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="26" fill="#121417">2</text><text x="358.0" y="230" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="30" fill="#eceeea">Quote + ETA</text><text x="358.0" y="276" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="600" font-size="18" fill="#a6aca5">Before anything moves</text><text x="358.0" y="302" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="600" font-size="18" fill="#a6aca5">Say yes or say no</text><path d="M582 250 L618 250" stroke="#ff6b2c" stroke-width="4" marker-end="url(#arr)"/><rect x="626" y="150" width="240" height="200" rx="10" fill="#1f2328" stroke="#4a5048" stroke-width="2"/><circle cx="666" cy="150" r="26" fill="#17673f" stroke="#121417" stroke-width="4"/><text x="666.0" y="160" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="26" fill="#eceeea">3</text><text x="650.0" y="230" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="30" fill="#eceeea">Operator sent</text><text x="650.0" y="276" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="600" font-size="18" fill="#a6aca5">Nearest licensed</text><text x="650.0" y="302" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="600" font-size="18" fill="#a6aca5">local tow operator</text><path d="M874 250 L910 250" stroke="#ff6b2c" stroke-width="4" marker-end="url(#arr)"/><rect x="918" y="150" width="240" height="200" rx="10" fill="#1f2328" stroke="#4a5048" stroke-width="2"/><circle cx="958" cy="150" r="26" fill="#17673f" stroke="#121417" stroke-width="4"/><text x="958.0" y="160" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="26" fill="#eceeea">4</text><text x="942.0" y="230" text-anchor="start" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="30" fill="#eceeea">Job done</text><text x="942.0" y="276" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="600" font-size="18" fill="#a6aca5">Towed, jumped, opened</text><text x="942.0" y="302" text-anchor="start" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="600" font-size="18" fill="#a6aca5">or back on the road</text><text x="600.0" y="90" text-anchor="middle" font-family="'Overpass','Arial Narrow',Arial,Helvetica,sans-serif" font-weight="900" font-size="34" fill="#eceeea">How a call to San Joaquin Towing works</text><text x="600.0" y="410" text-anchor="middle" font-family="'Public Sans',Arial,Helvetica,sans-serif" font-weight="600" font-size="20" fill="#a6aca5">Nothing is owed if you decline the quote.</text>
</svg>
